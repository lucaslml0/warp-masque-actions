name: VLESS 落地 over MASQUE（套娃）

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: WARP 设备名（后台显示用）
        required: false
        default: gh-actions
      source_url:
        description: VLESS 节点订阅文本 URL
        required: false
        default: https://lucaslml0.github.io/gate/jiedian.txt
      commit:
        description: 把生成的 yaml 提交回仓库
        type: boolean
        required: false
        default: true
      retention_days:
        description: Artifact 保留天数
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 Python 依赖
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -fsSL https://api.github.com/repos/Diniboy1123/usque/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          test -n "$VER" && test "$VER" != "null"
          curl -fsSL -o usque.zip "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque

      - name: 注册 WARP 设备
        env:
          DEVICE_NAME: ${{ inputs.device_name || 'gh-actions' }}
        run: |
          set -euo pipefail
          ./usque register -a -n "$DEVICE_NAME"
          test -s config.json
          python3 -c "import json; c=json.load(open('config.json')); print('WARP device registered; endpoint IPv4:', c.get('endpoint_v4'))"

      - name: 生成 VLESS 套娃配置
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://lucaslml0.github.io/gate/jiedian.txt' }}
        run: python3 scripts/gen_vless_masque.py config.json "$SOURCE_URL" dist

      - name: 校验配置可加载
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases | grep -o 'https://[^"]*mihomo-linux-amd64-alpha[^"]*\.gz' | head -1)
          test -n "$URL"
          curl -fsSL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          mkdir -p check
          cp dist/vless-masque.yaml check/config.yaml
          ./mihomo -t -d check
          echo "配置语法校验通过"

      - name: 提交配置回仓库
        if: inputs.commit
        run: |
          set -euo pipefail
          mkdir -p configs
          cp dist/vless-masque.yaml configs/vless-masque.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/vless-masque.yaml
          git diff --staged --quiet && { echo "配置无变化，跳过提交"; exit 0; }
          git commit -m "自动更新: VLESS over MASQUE 套娃配置 ($(date -u '+%F %T') UTC)"
          git push

      - name: 上传 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: vless-masque
          path: dist/vless-masque.yaml
          retention-days: ${{ inputs.retention_days || 7 }}
          if-no-files-found: error
