name: 部署 Worker（命令行）

# 对应 README「部署方式二：命令行」
#   cd worker && npm install && npx wrangler deploy
#
# 首次使用前在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN   — Cloudflare API Token（需 Workers 编辑 + Account 读）
#   CLOUDFLARE_ACCOUNT_ID  — 账号 ID（Workers 概览页右侧）
#   CLOUDFLARE_KV_ID       — KV namespace id
#                            （本机执行: npx wrangler kv namespace create KV）
#
# 可选：
#   CLOUDFLARE_WORKER_NAME — Worker 名称，默认 opera-masque

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Worker 名称（留空则用 secret 或默认 opera-masque）
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      #- "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 检查 Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          set -euo pipefail
          missing=
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${CLOUDFLARE_KV_ID:-}" ] && missing="$missing CLOUDFLARE_KV_ID"
          if [ -n "$missing" ]; then
            echo "缺 Secrets:$missing"
            echo "到 Settings → Secrets and variables → Actions 补上，见工作流注释。"
            exit 1
          fi
          echo "Secrets 已就绪"

      - name: 安装依赖
        run: npm install

      - name: 写入 wrangler.toml（KV id / 名称）
        env:
          KV: ${{ secrets.CLOUDFLARE_KV_ID }}
          NAME_INPUT: ${{ github.event.inputs.worker_name }}
          NAME_SECRET: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          set -euo pipefail
          NAME="${NAME_INPUT:-}"
          if [ -z "$NAME" ]; then NAME="${NAME_SECRET:-opera-masque}"; fi
          export NAME KV
          python3 <<'PY'
          from pathlib import Path
          import re, os
          p = Path("wrangler.toml")
          text = p.read_text(encoding="utf-8")
          name = os.environ["NAME"]
          kv = os.environ["KV"]
          text = re.sub(r'^name\s*=\s*".*"', f'name = "{name}"', text, count=1, flags=re.M)
          text = text.replace("在这里填你的 KV namespace id", kv)
          text = re.sub(
              r'(binding\s*=\s*"KV"\s*\nid\s*=\s*")[^"]*(")',
              rf"\g<1>{kv}\2",
              text,
              count=1,
          )
          p.write_text(text, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: 打包单文件（便于网页粘贴部署）
        run: npm run build

      - name: 上传 dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: worker-dist
          path: worker/dist/
          retention-days: 7
          if-no-files-found: warn
